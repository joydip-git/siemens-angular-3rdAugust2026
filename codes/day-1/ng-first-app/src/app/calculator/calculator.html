<form class="form-style">
    <fieldset>
        <legend>Calculator</legend>
        <div>
            <label for="radioAdd">Add:&nbsp;</label>
            <input type="radio" name="calculation" id="radioAdd" (change)="calculationChoice.set(1)">
            &nbsp;&nbsp;&nbsp;&nbsp;
            <label for="radioSub">Subtract:&nbsp;</label>
            <input type="radio" name="calculation" id="radioSub">
            &nbsp;&nbsp;&nbsp;&nbsp;
            <label for="radioMulti">Multiply:&nbsp;</label>
            <input type="radio" name="calculation" id="radioMulti">
            &nbsp;&nbsp;&nbsp;&nbsp;
            <label for="radioDiv">Divide</label>
            <input type="radio" name="calculation" id="radioDiv">
        </div>

        <div>
            <label for="txtFirst">First:&nbsp;</label>
            <input type="text" id="txtFirst" [(ngModel)]="first" name="secondInput">
        </div>
        <div>
            <label for="txtSecond">Second:&nbsp;</label>
            <!-- <input type="text" id="txtSecond" [value]="second" (input)="updateSecond($event.target.value)"> -->
            <input type="text" id="txtSecond" [(ngModel)]="second" name="secondInput">
        </div>
        <div class="button-center">
            <button type="button" (click)="calculate()">Calculate</button>
        </div>
        <div>
            <label for="txtResult">Result:&nbsp;</label>
            <input type="text" id="txtResult" readonly [value]="result()">
        </div>
    </fieldset>
</form>
