<h2>List of Todos</h2>
<br>
@if(todorecords.length>0){
<div>
    <label for="ddlTodos">Select a task: &nbsp;</label>
    <select name="todoSelect" id="ddlTodos" (change)="changeSelectedTodo(+(ddl.options[ddl.selectedIndex].value))" #ddl>
        <option selected disabled value="0">--select--</option>
        @for (todo of todorecords; track $index) {
        <option [value]="todo.id">
            {{todo.title}} [{{todo.userId}}]
            &nbsp;{{todo.completed?'done':'pending'}}
        </option>
        }
    </select>
</div>
<br>
<div>
    @if(selectedTodo){
    <app-todo-detail [todoData]="selectedTodo" (todoDataChange)="updateTodo($event)"></app-todo-detail>
    }@else {
    <span>select a title to view the details</span>
    }
</div>
}@else {
<span>No records</span>
}
