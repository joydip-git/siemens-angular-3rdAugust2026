@if(todoinfo){
<tr>
    <td>
        <label for="txtTitle">Task: &nbsp;</label>
    </td>
    <td>
        <input id="txtTitle" type="text" [value]="todoinfo.title" (input)="changeTodo({
            ...todoinfo,
            title:$event.target.value
        })">
    </td>
</tr>

<br>

<tr>
    <td>
        <label for="txtUserId">Assigned To: &nbsp;</label>
    </td>
    <td>
        <input type="text" id="txtUserId" [value]="todoinfo.userId" (input)="changeTodo({
            ...todoinfo,
            userId:+$event.target.value
        })">
    </td>
</tr>

<br>

<tr>
    <td>
        <label for="txtStatus">Status: &nbsp;</label>
    </td>
    <td>
        <input type="text" id="txtStatus" [value]="todoinfo.completed?'done':'pending'" readonly>
    </td>
</tr>
}
